<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capitão · Menú</title>
<meta name="theme-color" content="#0c0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Lobster&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0a09; --surface:#171311; --surface-2:#211b18; --ink:#f6f1ec; --muted:#a89b91;
    --line:#2e2621; --gold:#e0a85e; --star:#f0b25a; --alert:#3d2219; --alert-ink:#ffb497;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.55 Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  .script{font-family:Lobster,cursive;font-weight:400}
  .badge{width:52px;height:52px;border-radius:50%;background:#fff;color:#0c0a09;display:grid;place-items:center;font:800 1.35rem/1 Outfit,sans-serif;letter-spacing:-.04em;flex:none}

  /* Portada */
  .hero{position:relative;min-height:78vh;display:flex;align-items:flex-end;overflow:hidden}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:lento 22s ease-in-out infinite alternate}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,9,.25) 0%,rgba(12,10,9,.55) 45%,var(--bg) 100%)}
  .hero .wrap{position:relative;z-index:1;padding-bottom:48px;width:100%}
  .hero-top{position:absolute;top:20px;left:0;right:0;z-index:1}
  .hero h1{font:800 clamp(3rem,10vw,6rem)/.95 Outfit,sans-serif;letter-spacing:-.03em;margin:18px 0 10px}
  .hero h1 span{color:var(--gold)}
  .hero p{color:#e5dcd4;font-size:1.15rem;max-width:520px;margin:0}
  .hero .script{color:var(--gold);font-size:1.6rem}
  @keyframes lento{from{transform:scale(1.04)}to{transform:scale(1.14) translateY(-2%)}}

  /* Navegación */
  .nav{position:sticky;top:0;z-index:5;background:rgba(12,10,9,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex;gap:10px;align-items:center;padding-top:10px;padding-bottom:10px}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:.9rem;white-space:nowrap;cursor:pointer;text-decoration:none;color:var(--ink)}
  .chip:hover{border-color:var(--gold);color:var(--gold)}
  #buscar{width:180px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}

  /* Secciones */
  section{padding:56px 0 8px;scroll-margin-top:60px}
  .sec-title{font:800 clamp(2.4rem,7vw,3.6rem)/1 Outfit,sans-serif;letter-spacing:-.03em;margin:0 0 6px}
  .sec-title span{color:var(--gold)}
  .banner{position:relative;border-radius:22px;overflow:hidden;margin:18px 0 8px;height:clamp(200px,38vw,340px)}
  .banner img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
  .banner:hover img{transform:scale(1.05)}
  .grupo{font-size:clamp(1.8rem,4.5vw,2.4rem);margin:34px 0 4px;color:var(--ink)}
  .nota{color:var(--gold);font-weight:600;font-size:.95rem;margin:0 0 10px}

  .destacados{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin:16px 0 10px}
  .feat{position:relative;border:0;padding:0;border-radius:22px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;aspect-ratio:4/3}
  .feat img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
  .feat:hover img,.feat:focus-visible img{transform:scale(1.07)}
  .feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85))}
  .feat .info{position:absolute;left:18px;right:18px;bottom:16px;z-index:1}
  .feat .info strong{display:block;font-size:1.3rem;font-weight:700;line-height:1.2}
  .feat .tagfoto{position:absolute;top:14px;left:14px;z-index:1;background:rgba(12,10,9,.7);backdrop-filter:blur(6px);padding:5px 11px;border-radius:999px;font-size:.78rem;font-weight:600}

  .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));column-gap:48px}
  .item{display:block;width:100%;border:0;background:none;text-align:left;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover .nombre{color:var(--gold)}
  .fila{display:flex;align-items:baseline;gap:10px}
  .nombre{font-weight:600;font-size:1.08rem;transition:color .2s}
  .puntos{flex:1;border-bottom:1px dotted #4a3f38;transform:translateY(-4px);min-width:16px}
  .precio{font-weight:600;color:var(--gold);white-space:nowrap}
  .item p{margin:4px 0 6px;color:var(--muted);font-size:.93rem}
  .meta{font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:center}
  .stars{color:var(--star);letter-spacing:1px}
  .vacio{color:var(--muted);text-align:center;padding:60px 0}

  footer{margin-top:60px;border-top:1px solid var(--line);padding:40px 0 60px;text-align:center;color:var(--muted)}
  footer .script{color:var(--gold);font-size:1.8rem;margin:0 0 6px}
  footer .fila{justify-content:center;gap:12px;margin-top:18px}

  /* Detalle */
  dialog{border:0;padding:0;border-radius:24px;width:min(980px,calc(100% - 20px));max-height:calc(100% - 20px);background:var(--surface);color:var(--ink);box-shadow:0 40px 100px rgba(0,0,0,.6);overflow:hidden}
  dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
  .cerrar{position:absolute;top:12px;right:12px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:rgba(12,10,9,.75);color:#fff;font-size:1.6rem;cursor:pointer}
  .det{display:grid;grid-template-columns:1.15fr 1fr;max-height:calc(100vh - 20px)}
  .media{position:relative;background:#000;min-height:420px;overflow:hidden;perspective:900px}
  .media .foto{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;transition:transform .25s ease-out;will-change:transform}
  .media .sinfoto{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#2a211c,#0c0a09)}
  .media .sinfoto span{font:800 6rem/1 Outfit,sans-serif;color:var(--gold);opacity:.9}
  .media .sinfoto small{display:block;color:var(--muted);margin-top:8px}
  .media .visor3d{position:absolute;inset:0}
  .media .visor3d canvas{width:100%!important;height:100%!important;display:block;cursor:grab}
  .media .pista{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:.8rem;color:#ddd;text-shadow:0 1px 4px #000;pointer-events:none;z-index:2}
  .tabs{position:absolute;top:14px;left:14px;z-index:2;display:flex;gap:4px;background:rgba(12,10,9,.7);padding:4px;border-radius:999px;backdrop-filter:blur(6px)}
  .tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.85rem;cursor:pointer}
  .tabs button.on{background:var(--gold);color:#1a120c}
  .texto{padding:30px 28px;overflow-y:auto}
  .texto .eyebrow{color:var(--gold);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;margin:0 0 6px}
  .texto h2{font:700 2rem/1.1 Outfit,sans-serif;margin:0 0 10px;letter-spacing:-.02em}
  .texto h4{margin:22px 0 8px;font-weight:600;font-size:.95rem}
  .texto .desc{color:#d8cec6;margin:10px 0 0}
  .opciones{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .opciones li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .opciones li:last-child{border-bottom:0}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:var(--alert);color:var(--alert-ink);padding:4px 11px;border-radius:999px;font-size:.82rem;font-weight:600}
  .aviso{font-size:.78rem;color:var(--muted);margin:8px 0 0}
  .grande{font-size:1.35rem}
  .form{display:grid;gap:10px;background:var(--bg);padding:14px;border-radius:16px;border:1px solid var(--line)}
  .form input,.form textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);resize:vertical}
  .selector{display:flex;gap:2px}
  .selector button{border:0;background:none;font-size:1.8rem;line-height:1;cursor:pointer;color:#3d332d;padding:2px}
  .selector button.on{color:var(--star)}
  .btn{border:0;background:var(--gold);color:#1a120c;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}
  .error{color:var(--alert-ink);font-size:.85rem;margin:0}
  .resenas{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:12px}
  .resenas li{border-bottom:1px solid var(--line);padding-bottom:12px}
  .resenas p{margin:4px 0;color:#d8cec6}
  small{color:var(--muted)}

  @media (max-width:760px){
    .nav .wrap{flex-wrap:wrap}
    #buscar{width:100%;order:2}
    .hero{min-height:70vh}
    dialog{overflow-y:auto}
    .det{grid-template-columns:1fr;max-height:none}
    .media{min-height:62vw}
    .texto{padding:22px 18px 28px}
    .lista{grid-template-columns:1fr}
    .destacados{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){ .hero img{animation:none} }
</style>

  { id:'individual', cat:'sushi', grupo:'Combos', nombre:'Combo individual', precio:90000,
    desc:'4 Uramaki Philadelphia, 4 Uramaki California, Temaki de salmón.' },
  { id:'hikari', cat:'sushi', grupo:'Combos', nombre:'Combo Hikari', precio:150000,
    desc:'4 Sashimi de salmón, 4 Uramaki Philadelphia, 4 Hosomaki de salmón, 4 Joe de salmón, 4 Uramaki California.' },

  // ---------- A LA BRASA ----------
  { id:'combo-brasa', cat:'brasa', grupo:'A la brasa', nombre:'Combo a la brasa', precio:495000, porcion:'Para 4 personas',
    desc:'Prime rib, bife de chorizo, asado en tiras, picaña, pan de ajo, mandioca, ensalada mixta, arroz, papas fritas, farofa, vinagreta y chimichurri.' },
  { id:'filet-brasa', cat:'brasa', grupo:'Carnes a la brasa', nombre:'Filet mignon',
    opciones:[{n:'Para 1 persona',p:190000},{n:'Para 2 personas',p:265000}] },
  { id:'picana', cat:'brasa', grupo:'Carnes a la brasa', nombre:'Picaña a la plancha',
    opciones:[{n:'Para 2 personas',p:225000},{n:'Para 3 personas',p:299000}] },
  { id:'ojo-brasa', cat:'brasa', grupo:'Carnes a la brasa', nombre:'Ojo de bife',
    opciones:[{n:'Para 1 persona',p:169000},{n:'Para 2 personas',p:245000}] },
  { id:'prime-rib', cat:'brasa', grupo:'Carnes a la brasa', nombre:'Prime rib', precio:245000, porcion:'Para 2 personas' },
  { id:'asado-tiras', cat:'brasa', grupo:'Carnes a la brasa', nombre:'Asado en tiras',
    opciones:[{n:'Para 1 persona',p:169000},{n:'Para 2 personas',p:245000}] },
  { id:'pollo-brasa', cat:'brasa', grupo:'Carnes a la brasa', nombre:'Pollo a la brasa',
    opciones:[{n:'Para 1 persona',p:99000},{n:'Para 2 personas',p:169000}] },
  { id:'bife-chorizo', cat:'brasa', grupo:'Carnes a la brasa', nombre:'Bife de chorizo',
    opciones:[{n:'Para 1 persona',p:149000},{n:'Para 2 personas',p:225000}] },
  { id:'extras', cat:'brasa', grupo:'Extras', nombre:'Guarniciones y salsas',
    opciones:[{n:'Salsa extra (vinagreta, chimichurri o salsa de ajo)',p:10000},{n:'Mandioca frita',p:25000},{n:'Ensalada mixta',p:25000},{n:'Papas rústicas',p:25000},{n:'Arroz',p:20000},{n:'Pan de ajo',p:20000},{n:'Chipa guazú',p:35000},{n:'Sopa',p:35000}],
    desc:'Para sumar a tu corte.' },

  // ---------- POSTRES ----------
  { id:'cheesecake', cat:'postres', nombre:'Cheesecake de frutos rojos', precio:35000, foto:'cheesecake',
    desc:'Cremoso cheesecake sobre base de galleta, cubierto con salsa de frutos rojos y frutillas frescas.', contiene:['Lácteos','Gluten','Huevo'] },
  { id:'budin', cat:'postres', nombre:'Budín', precio:25000 },
  { id:'petit', cat:'postres', nombre:'Petit Gateau', precio:45000 },
  { id:'brownie', cat:'postres', nombre:'Brownie', precio:42000 },
  { id:'tiramisu', cat:'postres', nombre:'Tiramisú', precio:35000 }
];
const NOTAS_GRUPO = { 'Carnes a la brasa':'Acompaña ensalada mixta, arroz y farofa', 'A la brasa':'Acompaña ensalada mixta, arroz y farofa' };

/* ============ Utilidades ============ */
const $ = id => document.getElementById(id);
const gs = n => 'Gs. ' + n.toLocaleString('es-PY');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const estrellas = n => { const r = Math.round(n); return '★'.repeat(r) + '☆'.repeat(5 - r); };
const precioCorto = p => p.opciones ? (p.opciones.length > 1 ? 'desde ' : '') + gs(Math.min(...p.opciones.map(o => o.p))) : gs(p.precio);

/* ============ Reseñas (en este navegador) ============ */
const CLAVE = 'capitao-resenas';
let resenas = {};
try { resenas = JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch {}
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(resenas)); } catch {} };
const resenasDe = p => resenas[p.id] || [];
const promedio = rs => rs.length ? rs.reduce((s, r) => s + r.estrellas, 0) / rs.length : 0;
function metaHTML(p){
  const rs = resenasDe(p), avg = promedio(rs);
  return rs.length ? `<span class="stars">${estrellas(avg)}</span><span>${avg.toFixed(1)} · ${rs.length} reseña${rs.length > 1 ? 's' : ''}</span>` : `<span>☆ Sé el primero en opinar</span>`;
}

/* ============ Carta ============ */
$('chips').innerHTML = CATEGORIAS.map(c => `<a class="chip" href="#${c.id}">${c.titulo}</a>`).join('');
let texto = '';
$('buscar').addEventListener('input', e => { texto = e.target.value; render(); });

function render(){
  const t = texto.trim().toLowerCase();
  const pasa = p => !t || [p.nombre, p.desc || '', ...(p.opciones || []).map(o => o.n)].join(' ').toLowerCase().includes(t);
  let total = 0;
  $('menu').innerHTML = CATEGORIAS.map(c => {
    const items = PLATOS.filter(p => p.cat === c.id && pasa(p));
    total += items.length;
    if (!items.length) return '';
    const grupos = [...new Set(items.map(p => p.grupo || ''))];
    return `<section id="${c.id}">
      <h2 class="sec-title">${c.titulo}<span>.</span></h2>
      ${c.banner && !t ? `<div class="banner"><img src="${FOTOS[c.banner]}" alt="${c.titulo}" loading="lazy"></div>` : ''}
      ${grupos.map(g => {
        const del = items.filter(p => (p.grupo || '') === g);
        const conFoto = del.filter(p => p.foto), sinFoto = del.filter(p => !p.foto);
        return `${g ? `<h3 class="grupo script">${g}</h3>` : ''}
          ${NOTAS_GRUPO[g] ? `<p class="nota">${NOTAS_GRUPO[g]}</p>` : ''}
          ${conFoto.length ? `<div class="destacados">${conFoto.map(p => `
            <button class="feat" data-id="${p.id}" aria-label="Ver ${p.nombre}">
              <img src="${FOTOS[p.foto]}" alt="${p.nombre}" loading="lazy">
              <span class="tagfoto">${p.modelo ? '◎ Ver en 3D' : '★ Destacado'}</span>
              <span class="info"><strong>${p.nombre}</strong><span class="precio">${precioCorto(p)}</span>
                <span class="meta">${metaHTML(p)}</span></span>
            </button>`).join('')}</div>` : ''}
          ${sinFoto.length ? `<div class="lista">${sinFoto.map(p => `
            <button class="item" data-id="${p.id}">
              <span class="fila"><span class="nombre">${p.nombre}</span><span class="puntos"></span><span class="precio">${precioCorto(p)}</span></span>
              ${p.desc ? `<p>${p.desc}</p>` : ''}
              <span class="meta">${p.porcion ? `<span>${p.porcion}</span>·` : ''}${metaHTML(p)}</span>
            </button>`).join('')}</div>` : ''}`;
      }).join('')}
    </section>`;
  }).join('');
  $('vacio').hidden = total > 0;
}
$('menu').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) abrir(b.dataset.id); });

/* ============ Detalle ============ */
let actual = null;
function abrir(id){
  const p = PLATOS.find(x => x.id === id); if (!p) return;
  actual = p;
  renderMedia(p, p.modelo ? '3d' : 'foto');
  renderTexto(p);
  $('modal').showModal();
  $('texto').scrollTop = 0;
}
$('cerrar').addEventListener('click', () => $('modal').close());
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').close(); });
$('modal').addEventListener('close', () => { parar3D(); actual = null; });

function renderMedia(p, modo){
  parar3D();
  const m = $('media');
  const tabs = p.modelo && p.foto ? `<div class="tabs"><button data-modo="foto" class="${modo === 'foto' ? 'on' : ''}">Foto</button><button data-modo="3d" class="${modo === '3d' ? 'on' : ''}">3D</button></div>` : '';
  if (modo === '3d' && p.modelo) {
    m.innerHTML = `${tabs}<div class="visor3d" id="visor3d"></div><p class="pista" id="pista">Cargando modelo 3D…</p>`;
    iniciar3D(p.modelo);
  } else if (p.foto) {
    m.innerHTML = `${tabs}<img class="foto" id="foto" src="${FOTOS[p.foto]}" alt="${p.nombre}"><p class="pista">Mové el dedo o el mouse sobre la foto</p>`;
    inclinar(m, $('foto'));
  } else {
    m.innerHTML = `<div class="sinfoto"><div><span>${p.nombre.charAt(0)}</span><small>Foto próximamente</small></div></div>`;
  }
  m.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => renderMedia(p, b.dataset.modo)));
}

// Efecto de profundidad: la foto se inclina siguiendo el dedo o el mouse
function inclinar(cont, img){
  const mover = (x, y) => { img.style.transform = `rotateY(${x * 9}deg) rotateX(${-y * 9}deg) scale(1.05)`; };
  cont.onpointermove = e => { const r = cont.getBoundingClientRect(); mover((e.clientX - r.left) / r.width - .5, (e.clientY - r.top) / r.height - .5); };
  cont.onpointerleave = () => { img.style.transform = ''; };
}

function renderTexto(p){
  const cat = CATEGORIAS.find(c => c.id === p.cat);
  const rs = resenasDe(p), avg = promedio(rs);
  $('texto').innerHTML = `
    <p class="eyebrow">${cat.titulo}${p.grupo && p.grupo !== cat.titulo ? ' · ' + p.grupo : ''}</p>
    <h2>${p.nombre}</h2>
    <div class="fila"><span class="precio grande">${precioCorto(p)}</span>
      ${rs.length ? `<span class="stars">${estrellas(avg)}</span><small>${avg.toFixed(1)} de 5</small>` : ''}</div>
    ${p.porcion ? `<small>${p.porcion}</small>` : ''}
    ${p.desc ? `<p class="desc">${p.desc}</p>` : ''}
    ${NOTAS_GRUPO[p.grupo] ? `<p class="nota" style="margin-top:10px">${NOTAS_GRUPO[p.grupo]}</p>` : ''}
    ${p.opciones ? `<h4>Opciones</h4><ul class="opciones">${p.opciones.map(o => `<li><span>${o.n}</span><span class="precio">${gs(o.p)}</span></li>`).join('')}</ul>` : ''}
    ${p.contiene ? `<h4>Contiene</h4><div class="tags">${p.contiene.map(c => `<span class="tag">${c}</span>`).join('')}</div>
      <p class="aviso">Información orientativa. Consultá con nuestro personal ante alergias.</p>` : ''}
    <h4>Reseñas (${rs.length})</h4>
    <form class="form" id="form" novalidate>
      <div class="selector" role="radiogroup" aria-label="Puntuación">${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}" aria-label="${n} estrella${n > 1 ? 's' : ''}">★</button>`).join('')}</div>
      <input name="nombre" placeholder="Tu nombre" maxlength="40">
      <textarea name="comentario" placeholder="¿Qué te pareció el plato?" maxlength="400" rows="3"></textarea>
      <p class="error" id="error" hidden></p>
      <button class="btn" type="submit">Publicar reseña</button>
    </form>
    <ul class="resenas">${rs.length ? rs.map(r => `<li>
      <div class="fila"><strong>${esc(r.nombre)}</strong><span class="stars">${estrellas(r.estrellas)}</span></div>
      <p>${esc(r.comentario)}</p><small>${new Date(r.fecha).toLocaleDateString('es-PY')}</small></li>`).join('') : '<li><small>Todavía no hay reseñas. ¡Probalo y contanos!</small></li>'}</ul>`;

  let puntos = 0;
  const bs = [...$('texto').querySelectorAll('.selector button')];
  const pintar = n => bs.forEach(b => b.classList.toggle('on', +b.dataset.n <= n));
  bs.forEach(b => {
    b.onclick = () => { puntos = +b.dataset.n; pintar(puntos); };
    b.onmouseenter = () => pintar(+b.dataset.n);
    b.onmouseleave = () => pintar(puntos);
  });
  $('form').onsubmit = e => {
    e.preventDefault();
    const f = e.target, nombre = f.nombre.value.trim(), comentario = f.comentario.value.trim();
    const err = !puntos ? 'Elegí de 1 a 5 estrellas.' : !nombre ? 'Escribí tu nombre.' : !comentario ? 'Contanos qué te pareció.' : '';
    if (err) { $('error').textContent = err; $('error').hidden = false; return; }
    (resenas[p.id] ||= []).unshift({ nombre, estrellas: puntos, comentario, fecha: new Date().toISOString() });
    guardar(); renderTexto(p); render();
  };
}

/* ============ Visor 3D (se carga solo si el plato tiene "modelo") ============ */
let detener3D = null;
function parar3D(){ if (detener3D) { detener3D(); detener3D = null; } }
async function iniciar3D(url){
  const cont = $('visor3d');
  try {
    const THREE = await import('three');
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    if (!cont.isConnected) return;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    cont.appendChild(renderer.domElement);
    const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
    scene.add(new THREE.HemisphereLight(0xfff3e6, 0x2a1f19, 1.4));
    const sol = new THREE.DirectionalLight(0xffffff, 2); sol.position.set(3, 5, 2); scene.add(sol);
    const controls = new OrbitControls(camera, renderer.domElement);
    Object.assign(controls, { enableDamping: true, autoRotate: true, autoRotateSpeed: 1.5 });
    renderer.domElement.addEventListener('pointerdown', () => controls.autoRotate = false);
    const ajustar = () => { const w = cont.clientWidth, h = cont.clientHeight; if (w && h) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); } };
    const ro = new ResizeObserver(ajustar); ro.observe(cont); ajustar();
    let vivo = true;
    (function loop(){ if (!vivo) return; controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
    detener3D = () => { vivo = false; ro.disconnect(); renderer.dispose(); };
    new GLTFLoader().load(url, g => {
      const obj = g.scene, caja = new THREE.Box3().setFromObject(obj);
      const tam = caja.getSize(new THREE.Vector3()), c = caja.getCenter(new THREE.Vector3());
      obj.position.sub(c); scene.add(obj);
      const d = Math.max(tam.x, tam.y, tam.z) * 1.8;
      camera.position.set(0, d * 0.5, d); controls.target.set(0, 0, 0);
      controls.minDistance = d * 0.4; controls.maxDistance = d * 3;
      const pista = $('pista'); if (pista) pista.textContent = 'Arrastrá para girar · Pellizcá para hacer zoom';
    }, undefined, () => { const pista = $('pista'); if (pista) pista.textContent = 'No se pudo cargar el modelo 3D.'; });
  } catch {
    const pista = $('pista'); if (pista) pista.textContent = 'Se necesita internet para ver el 3D.';
  }
}

render();
</script>
